<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerShelf Pro v1.1</title>
    <meta name="theme-color" content="#107c10">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:,">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000000; color: #e0e0e0; margin: 0; padding: 20px; padding-bottom: 80px; }
        
        /* Evita el parpadeo inicial */
        #login-screen, #app-content { display: none; } 

        header { max-width: 900px; margin: 0 auto 30px; text-align: center; }
        .header-logo { max-width: 100%; height: auto; margin-top: 10px; }
        
        /* --- LOGIN --- */
        #login-screen { text-align: center; margin-top: 100px; flex-direction: column; align-items: center; gap: 5px; }
        .login-assets-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 25px; }
        .login-deco { width: 38px; height: auto; filter: drop-shadow(0px 0px 8px rgba(68, 207, 108, 0.6)); }
        .btn-google { 
            background: white; color: #222; padding: 12px 24px; border-radius: 8px; border: none; 
            font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 12px; 
            transition: 0.3s; box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .btn-google:hover { box-shadow: 0 4px 20px rgba(68, 207, 108, 0.4); transform: translateY(-2px); }

        /* --- APP LAYOUT --- */
        .tools-container { 
            max-width: 900px; margin: 0 auto 40px; padding: 25px; 
            background: #1a1a1a; border-radius: 15px; border: 1px solid #333; 
            position: relative; display: flex; flex-direction: column; gap: 15px;
        }

        .deco-img { position: absolute; top: 120px; width: 38px; height: auto; filter: drop-shadow(0px 0px 8px rgba(68, 207, 108, 0.6)); z-index: 1; }
        .img-escudo { left: 20px; }
        .img-pocion { right: 20px; }

        .form-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        
        #buscador { padding: 12px 25px; border-radius: 25px; border: 2px solid #333; background: #1e1e1e; color: white; width: 80%; outline: none; margin-bottom: 10px; align-self: center; }
        .autocomplete-container { width: 100%; position: relative; }
        .input-add, .select-add { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; width: 100%; box-sizing: border-box; }

        .btn-add { 
            cursor:pointer; background:#44cf6c; border:none; padding:10px 20px; 
            border-radius:8px; font-weight:bold; color: #000; transition: 0.3s;
            box-shadow: 0 4px 10px rgba(68, 207, 108, 0.2);
        }
        .btn-add:hover { box-shadow: 0 4px 20px rgba(68, 207, 108, 0.6); transform: translateY(-2px); }

        .suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #252525; border: 2px solid #44cf6c; border-radius: 0 0 8px 8px;
            z-index: 99999; max-height: 250px; overflow-y: auto; display: none;
        }
        .suggestion-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .suggestion-item img { width: 40px; height: 55px; object-fit: cover; border-radius: 3px; }

        .btn-logout { background: none; border: 1px solid #444; color: #888; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; margin-top: 10px; align-self: center; }

        .console-section { background: #161616; border-radius: 15px; margin-bottom: 30px; padding: 20px; border: 1px solid #222; }
        .console-header { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #44cf6c; padding-bottom: 10px; margin-bottom: 20px; }
        .console-header img { height: 40px; width: auto; background: white; padding: 3px; border-radius: 5px; }
        .genres-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .genre-box { background: #1e1e1e; padding: 12px; border-radius: 8px; }
        ul { list-style: none; padding: 0; }
        li { padding: 8px; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; }
        .game-thumb { width: 35px; height: 48px; object-fit: cover; border-radius: 4px; border: 1px solid #444; }
        .game-title { flex-grow: 1; }
        .btn-del { color: #555; background: none; border: none; cursor: pointer; font-size: 1rem; }
        
        /* FOOTER DINÁMICO */
        .footer-info { position: fixed; bottom: 0; left: 0; width: 100%; background: #107c10; color: white; text-align: center; padding: 8px 0; font-weight: bold; z-index: 100; transition: all 0.5s; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="imagenes/titulo.png" alt="GamerShelf Pro" style="max-width: 80%;">
        <p>Tu colección de videojuegos en la nube.</p>
        <div class="login-assets-row">
            <img src="imagenes/escudo.png" class="login-deco" alt="Escudo">
            <button class="btn-google" id="btn-login" onclick="login()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                Entrar con Google
            </button>
            <img src="imagenes/pocion.png" class="login-deco" alt="Poción" style="margin-top: -5px;">
        </div>
    </div>

    <div id="app-content">
        <header>
            <img src="imagenes/titulo.png" alt="GamerShelf Pro" class="header-logo">
            <div class="tools-container">
                <img src="imagenes/skin1.png" alt="Skin" style="height: 150px; align-self: center; margin-bottom: 10px;">
                
                <img src="imagenes/escudo.png" class="deco-img img-escudo" alt="Escudo">
                <img src="imagenes/pocion.png" class="deco-img img-pocion" alt="Poción">

                <input type="text" id="buscador" placeholder="Buscar en mi colección...">
                
                <div class="autocomplete-container">
                    <input type="text" id="add-titulo" class="input-add" placeholder="Escribe el título del juego...">
                    <div id="suggestions" class="suggestions"></div>
                </div>

                <div class="form-row">
                    <select id="add-consola" class="select-add" style="flex: 1;">
                        <option value="xbox_one_series" selected>Xbox One/Series</option>
                        <option value="ps5">PS5</option>
                        <option value="n_switch">Switch</option>
                    </select>
                    <button onclick="agregarJuego()" class="btn-add">AÑADIR</button>
                </div>
                
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>
        <div id="main-container"></div>
    </div>

    <div id="info-footer" class="footer-info">Cargando...</div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAb3GqlzjbDTNxLGI8maiF3U0qGieGERdw",
            authDomain: "estanteria-gamer.firebaseapp.com",
            projectId: "estanteria-gamer",
            storageBucket: "estanteria-gamer.firebasestorage.app",
            messagingSenderId: "181559174957",
            appId: "1:181559174957:web:7d6e99f7cd32632ba8d5a4"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let totalJuegosGlobal = 0;
        let mostrandoSaludo = false;

        auth.onAuthStateChanged(user => {
            const footer = document.getElementById('info-footer');
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                
                // Mostrar Saludo
                mostrandoSaludo = true;
                footer.innerText = `¡Hola, ${user.displayName || 'Gamer'}!`;
                
                // Cargar datos
                escucharJuegos(user.uid);

                // Quitar saludo a los 5 segundos
                setTimeout(() => {
                    mostrandoSaludo = false;
                    actualizarFooter();
                }, 5000);

            } else {
                document.getElementById('app-content').style.display = 'none';
                document.getElementById('login-screen').style.display = 'flex';
                footer.innerText = "v1.1 | Nube Directa";
            }
        });

        // Función para escuchar cambios en la base de datos y contar juegos
        function escucharJuegos(uid) {
            // Reemplaza "juegos" por el nombre exacto de tu colección en Firestore
            db.collection("usuarios").doc(uid).collection("juegos").onSnapshot(snapshot => {
                totalJuegosGlobal = snapshot.size;
                if (!mostrandoSaludo) {
                    actualizarFooter();
                }
            });
        }

        function actualizarFooter() {
            document.getElementById('info-footer').innerText = `Total de juegos: ${totalJuegosGlobal}`;
        }

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function logout() { 
            auth.signOut().then(() => location.reload()); 
        }
    </script>
</body>
</html>
