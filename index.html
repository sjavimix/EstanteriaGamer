<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerShelf Pro v1.2.0</title>
    <meta name="theme-color" content="#107c10">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:,">

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <style>
        /* --- SISTEMA DE SKINS (VARIABLES) --- */
        :root {
            --main-color: #107c10; /* Xbox por defecto */
            --bg-body: #000000;
            --panel-bg: #1a1a1a;
            --transition-speed: 0.5s;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-body); 
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px; 
            padding-bottom: 100px;
            transition: background var(--transition-speed);
        }

        /* --- MENÚ DE SKINS --- */
        #skin-selector {
            display: none;
            background: #222;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid var(--main-color);
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            transition: border var(--transition-speed);
        }
        .skin-option {
            cursor: pointer;
            text-align: center;
            padding: 5px;
            border-radius: 8px;
            background: #333;
            transition: transform 0.2s;
        }
        .skin-option:active { transform: scale(0.9); }
        .skin-option img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
        .skin-option p { font-size: 0.6rem; margin: 5px 0 0; font-weight: bold; }

        header { max-width: 900px; margin: 0 auto 30px; text-align: center; }
        .header-logo { max-width: 100%; height: auto; margin-top: 10px; }
        
        #login-screen, #app-content { display: none; }

        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; justify-content: center; align-items: center; z-index: 9999;
        }

        #login-screen { 
            text-align: center; margin-top: 100px; flex-direction: column; 
            align-items: center; gap: 20px; max-width: 400px; margin-left: auto; margin-right: auto;
        }

        .btn-google { 
            background: white; color: #444; padding: 12px 24px; border-radius: 5px; 
            border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 10px; 
        }
        
        .tools-container { 
            max-width: 900px; margin: 0 auto 40px; padding: 25px; 
            background: var(--panel-bg); border-radius: 15px; border: 1px solid #333; 
            position: relative; display: flex; flex-direction: column; gap: 15px;
        }

        .deco-img { position: absolute; width: 38px; height: auto; z-index: 1; }
        #login-screen .img-pocion { top: calc(100% - 52px); right: 10px; }
        #login-screen .img-escudo { top: calc(100% - 46px); left: 5px; }

        .form-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 50; }
        #buscador { padding: 12px 25px; border-radius: 25px; border: 2px solid #333; background: #1e1e1e; color: white; width: 80%; outline: none; margin-bottom: 10px; align-self: center; }
        
        .input-add, .select-add { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; width: 100%; box-sizing: border-box; }

        .btn-add { cursor:pointer; background: var(--main-color); border:none; padding:10px 20px; border-radius:8px; font-weight:bold; color: #fff; transition: var(--transition-speed); }
        .btn-logout { background: none; border: 1px solid #444; color: #888; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; margin-top: 10px; }

        .console-section { background: #161616; border-radius: 15px; margin-bottom: 30px; padding: 20px; border: 1px solid #222; }
        .console-header { display: block; border-bottom: 2px solid var(--main-color); padding-bottom: 10px; margin-bottom: 20px; transition: border var(--transition-speed); }
        .console-header h2 { margin: 0; font-size: 1.4rem; text-align: left; text-shadow: 0 0 10px var(--main-color); }

        .genres-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .genre-box { background: #1e1e1e; padding: 12px; border-radius: 8px; }
        li { padding: 8px; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; }
        .game-thumb { width: 35px; height: 48px; object-fit: cover; border-radius: 4px; }

        .footer-info { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--main-color); color: white; text-align: center; padding: 12px 0; font-weight: bold; z-index: 1000; transition: background var(--transition-speed); }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <img src="imagenes/titulo.png" style="width: 200px; opacity: 0.5;">
    </div>

    <div id="login-screen">
        <img src="imagenes/titulo.png" alt="GamerShelf Pro" style="max-width: 80%;">
        <p>Tu colección de videojuegos en la nube.</p>
        <button class="btn-google" onclick="login()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Entrar con Google
        </button>
        <img src="imagenes/escudo.png" class="deco-img img-escudo">
        <img src="imagenes/pocion.png" class="deco-img img-pocion">
    </div>

    <div id="app-content">
        <header>
            <img src="imagenes/titulo.png" alt="GamerShelf Pro" class="header-logo">
            
            <div class="tools-container">
                <button onclick="toggleSkinMenu()" style="background:#333; color:#ccc; border:1px solid #555; border-radius:20px; padding:5px 15px; cursor:pointer; align-self:center; font-size:0.8rem;">🎨 CAMBIAR ASPECTO</button>
                
               <div id="skin-selector">
					<div class="skin-option" onclick="aplicarSkin('green', '#00ff88', 'skin1.png')">
						<div style="background: linear-gradient(135deg, #00ff88, #008f4c); height:50px; border-radius:5px;"></div>
						<p>ESMERALDA</p>
					</div>
					<div class="skin-option" onclick="simularAnuncio('blue', '#00d4ff', 'skin2.png')">
						<div style="background: linear-gradient(135deg, #00d4ff, #0056b3); height:50px; border-radius:5px;"></div>
						<p>OCÉANO 📺</p>
					</div>
					<div class="skin-option" onclick="simularAnuncio('red', '#ff4b2b', 'skin3.png')">
						<div style="background: linear-gradient(135deg, #ff416c, #ff4b2b); height:50px; border-radius:5px;"></div>
						<p>MAGMA 📺</p>
					</div>
				</div>

                <img id="avatar-actual" src="imagenes/skin1.png" alt="Skin" style="height: 120px; align-self: center; transition: 0.3s;">
                
                <input type="text" id="buscador" placeholder="Buscar en mi colección...">
                
                <div class="form-row">
                    <div style="position:relative; flex:2;">
                        <input type="text" id="add-titulo" class="input-add" placeholder="Escribe el título...">
                        <div id="suggestions" class="suggestions" style="position:absolute; background:#252525; width:100%; z-index:100; display:none; border:1px solid var(--main-color);"></div>
                    </div>
                    
                    <select id="add-consola" class="select-add" style="flex:1;">
                        <option value="ps5">PS5</option>
                        <option value="xbox_one_series" selected>Xbox Series</option>
                        <option value="n_switch">Switch</option>
                        <option value="pc">PC</option>
                    </select>

                    <button onclick="agregarJuego()" class="btn-add">AÑADIR</button>
                </div>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

        <div id="main-container"></div>
    </div>

    <div id="info-footer" class="footer-info">CONECTANDO AL SERVIDOR...</div>

    <script>
        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAb3GqlzjbDTNxLGI8maiF3U0qGieGERdw",
            authDomain: "estanteria-gamer.firebaseapp.com",
            projectId: "estanteria-gamer",
            storageBucket: "estanteria-gamer.firebasestorage.app",
            messagingSenderId: "181559174957",
            appId: "1:181559174957:web:7d6e99f7cd32632ba8d5a4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const RAWG_KEY = "21c0ccfd8ada49c6b44092b79b9bfbbb";
        
        let db_local = [];
        let fotoSeleccionada = "";
        let currentUser = null;

        // --- LÓGICA DE SKINS ---
        function toggleSkinMenu() {
            const menu = document.getElementById('skin-selector');
            menu.style.display = (menu.style.display === 'grid') ? 'none' : 'grid';
        }

        function simularAnuncio(nombre, color, img) {
            if(confirm(`¿Quieres ver un anuncio para desbloquear la skin de ${nombre.toUpperCase()}?`)) {
                const footer = document.getElementById('info-footer');
                footer.innerText = "📺 VIENDO ANUNCIO (5s)...";
                footer.style.background = "#f39c12";
                
                setTimeout(() => {
                    aplicarSkin(nombre, color, img);
                    footer.innerText = "✅ SKIN DESBLOQUEADA";
                    footer.style.background = color;
                    setTimeout(() => render(), 2000);
                }, 5000);
            }
        }

        function aplicarSkin(nombre, color, img) {
            document.documentElement.style.setProperty('--main-color', color);
            document.getElementById('avatar-actual').src = `imagenes/${img}`;
            document.querySelector('meta[name="theme-color"]').setAttribute("content", color);
            localStorage.setItem('skin_color', color);
            localStorage.setItem('skin_img', img);
        }

        // Cargar skin guardada al iniciar
        if(localStorage.getItem('skin_color')) {
            aplicarSkin('custom', localStorage.getItem('skin_color'), localStorage.getItem('skin_img'));
        }

        // --- NAVEGACIÓN Y AUTH ---
        auth.onAuthStateChanged(user => {
            document.getElementById('loading-overlay').style.display = 'none';
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                refreshData();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-content').style.display = 'none';
            }
        });

        function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut().then(() => location.reload()); }

        function refreshData() {
            db.collection("juegos").where("userId", "==", currentUser.uid).onSnapshot(snap => {
                db_local = [];
                snap.forEach(doc => db_local.push({ id: doc.id, ...doc.data() }));
                render();
            });
        }

        function render(filtro = "") {
            const container = document.getElementById('main-container');
            container.innerHTML = "";
            const filtrados = db_local.filter(j => j.titulo.toLowerCase().includes(filtro.toLowerCase()));
            const porConsola = filtrados.reduce((acc, j) => { acc[j.consola] = acc[j.consola] || []; acc[j.consola].push(j); return acc; }, {});

            Object.keys(porConsola).sort().forEach(c => {
                const section = document.createElement('div');
                section.className = 'console-section';
                section.innerHTML = `<div class="console-header"><h2>${c.toUpperCase()} (${porConsola[c].length})</h2></div><div class="genres-grid"></div>`;
                const grid = section.querySelector('.genres-grid');
                container.appendChild(section);
            });

            document.getElementById('info-footer').innerText = `TOTAL: ${filtrados.length} JUEGOS`;
        }

        // (Resto de funciones de agregar y borrar iguales...)
        document.getElementById('buscador').addEventListener('input', (e) => render(e.target.value));
    </script>
</body>
</html>
