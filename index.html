<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerShelf Pro v1.1</title>
    <meta name="theme-color" content="#107c10">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:,">

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000000; color: #e0e0e0; margin: 0; padding: 20px; padding-bottom: 80px; }
        header { max-width: 900px; margin: 0 auto 30px; text-align: center; }
        .header-logo { max-width: 100%; height: auto; margin-top: 10px; }
        
        /* --- ESTILOS MEJORADOS PANTALLA LOGIN --- */
        #login-screen { 
            text-align: center; 
            margin-top: 100px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 5px; /* Menos gap para acercar el texto al logo */
        }

        /* Contenedor central para el botón y las pociones (igual que tools-container) */
        .login-assets-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            position: relative;
            z-index: 10;
        }

        /* Las imágenes deco del login con brillo (igual que deco-img) */
        .login-deco { 
            width: 38px; 
            height: auto; 
            filter: drop-shadow(0px 0px 8px rgba(68, 207, 108, 0.6)); /* Brillo verde sutil */
        }

        /* Botón Google estilizado (parecido al btn-add) */
        .btn-google { 
            background: white; 
            color: #222; 
            padding: 12px 24px; 
            border-radius: 8px; /* Mismo border-radius que tus inputs */
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-size: 1rem;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        .btn-google:hover {
            box-shadow: 0 4px 20px rgba(68, 207, 108, 0.4); /* Brillo verde al pasar el ratón */
            transform: translateY(-2px);
        }

        .btn-google:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #app-content { display: none; } 

        /* --- TUS ESTILOS ORIGINALES (Mantenidos) --- */
        .tools-container { 
            max-width: 900px; margin: 0 auto 40px; padding: 25px; 
            background: #1a1a1a; border-radius: 15px; border: 1px solid #333; 
            position: relative; display: flex; flex-direction: column; gap: 15px;
        }

        .deco-img { position: absolute; top: 360px; width: 38px; height: auto; filter: drop-shadow(0px 0px 8px rgba(0,0,0,0.5)); z-index: 1; }
        .img-escudo { left: 20px; }
        .img-pocion { right: 20px; margin-top: -6px; }

        .form-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 50; }
        #buscador { padding: 12px 25px; border-radius: 25px; border: 2px solid #333; background: #1e1e1e; color: white; width: 80%; outline: none; margin-bottom: 10px; align-self: center; }
        
        .autocomplete-container { position: relative; flex: 2; min-width: 200px; }
        .input-add, .select-add { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #252525; color: white; width: 100%; box-sizing: border-box; }

        .suggestions {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #252525; border: 2px solid #44cf6c; border-radius: 0 0 8px 8px;
            z-index: 99999; max-height: 250px; overflow-y: auto; display: none;
        }
        .suggestion-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .suggestion-item img { width: 40px; height: 55px; object-fit: cover; border-radius: 3px; }

        .btn-add { cursor:pointer; background:#44cf6c; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; color: #000; transition: 0.3s; }
        .btn-logout { background: none; border: 1px solid #444; color: #888; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; margin-top: 10px; }

        .console-section { background: #161616; border-radius: 15px; margin-bottom: 30px; padding: 20px; border: 1px solid #222; }
        .console-header { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #44cf6c; padding-bottom: 10px; margin-bottom: 20px; }
        .console-header img { height: 40px; width: auto; background: white; padding: 3px; border-radius: 5px; }
        .genres-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .genre-box { background: #1e1e1e; padding: 12px; border-radius: 8px; }
        
        ul { list-style: none; padding: 0; }
        li { padding: 8px; border-bottom: 1px solid #2a2a2a; font-size: 0.85rem; display: flex; align-items: center; gap: 12px; }
        .game-thumb { width: 35px; height: 48px; object-fit: cover; border-radius: 4px; border: 1px solid #444; }
        .game-title { flex-grow: 1; }
        .btn-del { color: #555; background: none; border: none; cursor: pointer; font-size: 1rem; }

        .footer-info { position: fixed; bottom: 0; left: 0; width: 100%; background: #107c10; color: white; text-align: center; padding: 5px 0; font-weight: bold; z-index: 100; transition: all 0.5s; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="imagenes/titulo.png" alt="GamerShelf Pro" style="max-width: 80%;">
        <p>Tu colección de videojuegos en la nube.</p>
        
        <div class="login-assets-row">
            <img src="imagenes/escudo.png" class="login-deco" alt="Escudo">
            
            <button class="btn-google" id="btn-login" onclick="login()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
                Entrar con Google
            </button>
            
            <img src="imagenes/pocion.png" class="login-deco" alt="Poción" style="margin-top: -5px;"> </div>
    </div>

    <div id="app-content">
        <header>
            <img src="imagenes/titulo.png" alt="GamerShelf Pro" class="header-logo">
            <div class="tools-container">
                <img src="imagenes/skin1.png" alt="Skin" style="height: 152px; margin-top: -40px; margin-bottom: -10px; align-self: center;">
                <img src="imagenes/escudo.png" class="deco-img img-escudo" alt="Escudo">
                <img src="imagenes/pocion.png" class="deco-img img-pocion" alt="Poción">

                <input type="text" id="buscador" placeholder="Buscar en mi colección...">
                
                <div class="form-row">
                    <div class="autocomplete-container">
                        <input type="text" id="add-titulo" class="input-add" placeholder="Escribe el título del juego...">
                        <div id="suggestions" class="suggestions"></div>
                    </div>
                    
                    <select id="add-consola" class="select-add">
                        <optgroup label="Sony">
                            <option value="ps1">PS1</option>
                            <option value="ps2">PS2</option>
                            <option value="ps3">PS3</option>
                            <option value="ps4">PS4</option>
                            <option value="ps5">PS5</option>
                        </optgroup>
                        <optgroup label="Microsoft">
                            <option value="xbox_clasica">Xbox Clásica</option>
                            <option value="xbox_360">Xbox 360</option>
                            <option value="xbox_one_series" selected>Xbox One/Series</option>
                        </optgroup>
                        <optgroup label="Nintendo">
                            <option value="gameboy">Game Boy</option>
                            <option value="nintendo">NES</option>
                            <option value="super_nintendo">Super Nintendo</option>
                            <option value="n64">Nintendo 64</option>
                            <option value="gamecube">GameCube</option>
                            <option value="wii">Wii</option>
                            <option value="wii_u">Wii U</option>
                            <option value="n_switch">Switch</option>
                        </optgroup>
                        <optgroup label="Sega">
                            <option value="mastersystem2">Master System II</option>
                            <option value="megadrive">Mega Drive</option>
                            <option value="gamegear">Game Gear</option>
                            <option value="saturn">Sega Saturn</option>
                            <option value="dreamcast">Dreamcast</option>
                        </optgroup>
                        <optgroup label="Otros">
                            <option value="PCE">PC Engine</option>
                        </optgroup>
                    </select>

                    <button onclick="agregarJuego()" class="btn-add" style="margin-top: 14px;">AÑADIR</button>
                </div>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

        <div id="main-container"></div>
    </div>

    <div id="info-footer" class="footer-info">v1.1 | Nube Directa</div>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAb3GqlzjbDTNxLGI8maiF3U0qGieGERdw",
            authDomain: "estanteria-gamer.firebaseapp.com",
            projectId: "estanteria-gamer",
            storageBucket: "estanteria-gamer.firebasestorage.app",
            messagingSenderId: "181559174957",
            appId: "1:181559174957:web:7d6e99f7cd32632ba8d5a4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const RAWG_KEY = "21c0ccfd8ada49c6b44092b79b9bfbbb";
        
        let db_local = [];
        let fotoSeleccionada = "";
        let typingTimer;
        let bloqueoFooter = false;
        let currentUser = null;
        let mostrandoSaludo = false;

        // --- GESTIÓN DE USUARIO Y LOGIN (Mantenida) ---
        auth.getRedirectResult().then((result) => {
            if (result.user) {
                console.log("Sesión iniciada tras redirección:", result.user.email);
            }
        }).catch((error) => {
            console.error("Error en redirección:", error.code, error.message);
            alert("Error al entrar con Google: " + error.message);
            resetLoginButton();
        });

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                
                const nombre = user.displayName ? user.displayName.split(' ')[0] : 'Gamer';
                const footer = document.getElementById('info-footer');
                
                mostrandoSaludo = true;
                footer.innerText = `¡HOLA, ${nombre.toUpperCase()}! BIENVENIDO`;
                footer.style.background = "#3498db";

                setTimeout(() => {
                    mostrandoSaludo = false;
                    footer.style.background = "#107c10";
                    render(document.getElementById('buscador').value);
                }, 5000);

                refreshData();
            } else {
                currentUser = null;
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('app-content').style.display = 'none';
                resetLoginButton();
            }
        });

        function login() {
            const btn = document.getElementById('btn-login');
            btn.innerText = "Iniciando..."; // Texto más corto para no romper layout con assets
            btn.disabled = true;
            const provider = new firebase.auth.GoogleAuthProvider();
            // Cambiado a Popup para probar si es más fiable que redirect en móviles
            auth.signInWithPopup(provider).then((result) => {
                console.log("Login popup exitoso", result.user.email);
            }).catch((error) => {
                console.error("Error Popup:", error.code);
                // Si falla popup (ej: bloqueador), reintentar con redirect
                if(error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request'){
                    console.log("Reintentando con redirect...");
                    auth.signInWithRedirect(provider);
                } else {
                    alert("Error de Google: " + error.message);
                    resetLoginButton();
                }
            });
        }

        function resetLoginButton() {
            const btn = document.getElementById('btn-login');
            if(btn) { btn.innerText = "Entrar con Google"; btn.disabled = false; }
        }

        function logout() {
            auth.signOut().then(() => { location.reload(); });
        }

        // --- LÓGICA DE JUEGOS (Mantenida) ---
        const inputTitulo = document.getElementById('add-titulo');
        const suggestionsBox = document.getElementById('suggestions');

        inputTitulo.addEventListener('input', () => {
            clearTimeout(typingTimer);
            const query = inputTitulo.value.trim();
            if (query.length >= 3) {
                typingTimer = setTimeout(() => buscarEnRAWG(query), 500);
            } else {
                suggestionsBox.style.display = "none";
            }
        });

        async function buscarEnRAWG(q) {
            try {
                const res = await fetch(`https://api.rawg.io/api/games?key=${RAWG_KEY}&search=${encodeURIComponent(q)}&page_size=5`);
                const data = await res.json();
                suggestionsBox.innerHTML = "";
                if (data.results && data.results.length > 0) {
                    suggestionsBox.style.display = "block";
                    data.results.forEach(game => {
                        const div = document.createElement('div');
                        div.className = "suggestion-item";
                        div.innerHTML = `<img src="${game.background_image || ''}"> <span>${game.name}</span>`;
                        div.onclick = () => {
                            inputTitulo.value = game.name.toUpperCase();
                            fotoSeleccionada = game.background_image;
                            suggestionsBox.style.display = "none";
                        };
                        suggestionsBox.appendChild(div);
                    });
                }
            } catch (e) { console.error(e); }
        }

        function refreshData() {
            if(!currentUser) return;
            db.collection("juegos")
              .where("userId", "==", currentUser.uid)
              .onSnapshot(snap => {
                db_local = [];
                snap.forEach(doc => db_local.push({ id: doc.id, ...doc.data() }));
                render(document.getElementById('buscador').value);
            }, (error) => {
                console.error("Error Firestore:", error);
            });
        }

        function render(filtro = "") {
            const container = document.getElementById('main-container');
            container.innerHTML = "";
            const filtrados = db_local.filter(j => j.titulo.toLowerCase().includes(filtro.toLowerCase()));
            
            const porConsola = filtrados.reduce((acc, j) => { 
                acc[j.consola] = acc[j.consola] || []; 
                acc[j.consola].push(j); 
                return acc; 
            }, {});

            Object.keys(porConsola).sort().forEach(c => {
                const section = document.createElement('div');
                section.className = 'console-section';

                const traducciones = {
                    "ps1": "PS1", "ps2": "PS2", "ps3": "PS3", "ps4": "PS4", "ps5": "PS5",
                    "xbox_clasica": "XBOX CLÁSICA", "xbox_360": "XBOX 360", "xbox_one_series": "XBOX ONE / SERIES",
                    "gameboy": "GAME BOY", "nintendo": "NES", "super_nintendo": "SUPER NINTENDO",
                    "n64": "NINTENDO 64", "gamecube": "GAMECUBE", "wii": "WII", "wii_u": "WII U",
                    "n_switch": "NINTENDO SWITCH",
                    "mastersystem2": "MASTER SYSTEM II", "megadrive": "MEGA DRIVE", "gamegear": "GAME GEAR",
                    "saturn": "SEGA SATURN", "dreamcast": "DREAMCAST", "PCE": "PC ENGINE"
                };
                
                let nombreMostrar = traducciones[c] || c.toUpperCase();

                section.innerHTML = `
                    <div class="console-header">
                        <img src="imagenes/${c}.png" onerror="this.style.display='none'">
                        <h2>${nombreMostrar} (${porConsola[c].length})</h2>
                    </div>`;
                
                const grid = document.createElement('div');
                grid.className = 'genres-grid';
                
                porConsola[c].forEach(j => {
                    const box = document.createElement('div');
                    box.className = 'genre-box';
                    box.innerHTML = `<ul>
                            <li>
                                <img src="${j.foto || ''}" class="game-thumb">
                                <span class="game-title">${j.titulo}</span>
                                <button class="btn-del" onclick="borrarJuego('${j.id}')">✕</button>
                            </li>
                        </ul>`;
                    grid.appendChild(box);
                });
                section.appendChild(grid);
                container.appendChild(section);
            });

            if (!bloqueoFooter && currentUser && !mostrandoSaludo) {
                document.getElementById('info-footer').innerText = `TOTAL: ${filtrados.length} JUEGOS`;
                document.getElementById('info-footer').style.background = "#107c10";
            }
        }

        function agregarJuego() {
            const t = inputTitulo.value.trim();
            const c = document.getElementById('add-consola').value;
            if(!t || !currentUser) return;

            db.collection("juegos").add({
                titulo: t, 
                consola: c, 
                foto: fotoSeleccionada, 
                fecha: new Date(),
                userId: currentUser.uid 
            }).then(() => {
                mostrarFeedback(`✅ AÑADIDO: ${t.toUpperCase()}`, "#2ecc71");
                inputTitulo.value = "";
                fotoSeleccionada = "";
                suggestionsBox.style.display = "none";
            });
        }

        function borrarJuego(id) {
            const juego = db_local.find(j => j.id === id);
            if(confirm(`¿Eliminar ${juego.titulo.toUpperCase()}?`)) {
                db.collection("juegos").doc(id).delete().then(() => {
                    mostrarFeedback(`❌ ELIMINADO: ${juego.titulo.toUpperCase()}`, "#e74c3c");
                });
            }
        }

        function mostrarFeedback(msg, color) {
            const footer = document.getElementById('info-footer');
            bloqueoFooter = true;
            footer.innerText = msg;
            footer.style.background = color;
            setTimeout(() => {
                bloqueoFooter = false;
                render(document.getElementById('buscador').value);
            }, 3000);
        }

        document.getElementById('buscador').addEventListener('input', (e) => render(e.target.value));
    </script>
</body>
</html>
